name: 'Build and test Storm'
description: 'Configure, build, test, and install Storm inside the calling job'
inputs:
  nr_jobs:
    description: "Number of parallel build jobs"
    type: string
    default: "4"
  name:
    description: "Display name for the test configuration"
    type: string
    required: true
  buildType:
    description: "CMake build type (Debug or Release)"
    type: string
    required: true
  Developer:
    description: "Enable developer mode"
    type: boolean
    default: false
  carl_tag:
    description: "Carl version"
    type: string
    default: "master"
  cmakeArgs:
    description: "Extra CMake arguments"
    type: string
    default: ""
  starterProjectCommand:
    description: "Command to pass to the starter-project"
    type: string
    default: "--help"
  setup:
    description: "Shell command to install packages before configuring"
    type: string
    default: ""
  disable_cudd:
    type: boolean
    default: false
  disable_glpk:
    type: boolean
    default: false
  disable_gmm:
    type: boolean
    default: false
  disable_gurobi:
    type: boolean
    default: false
  disable_highs:
    type: boolean
    default: false
  disable_libarchive:
    type: boolean
    default: false
  disable_mathsat:
    type: boolean
    default: false
  disable_soplex:
    type: boolean
    default: false
  disable_spot:
    type: boolean
    default: false
  disable_sylvan:
    type: boolean
    default: false
  disable_xerces:
    type: boolean
    default: false
  disable_z3:
    type: boolean
    default: false
  ClnExact:
    description: "Use CLN for exact arithmetic"
    type: boolean
    default: false
  ClnRatfunc:
    description: "Use CLN for rational functions"
    type: boolean
    default: true
  AllSanitizers:
    description: "Enable all sanitizers"
    type: boolean
    default: false
  restore_cache:
    description: "Restore ccache from cache"
    type: boolean
    default: false
  save_cache:
    description: "Save ccache to cache"
    type: boolean
    default: false
  install:
    description: "Run post-build steps: starter project, install, run installed storm"
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    - name: Set CCACHE_DIR
      run: echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ci-ccache" >> "$GITHUB_ENV"
      shell: bash
    - name: Install packages
      if: inputs.setup != ''
      run: ${{ inputs.setup }}
      shell: bash
    - name: Ensure ccache directory exists
      if: inputs.restore_cache == 'true'
      run: mkdir -p "${CCACHE_DIR}"
      shell: bash
    - name: Restore ccache
      id: ccache-restore
      if: inputs.restore_cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
        restore-keys: |
          buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-
          buildtest-ccache-${{ inputs.name }}-
    - name: Prepare ccache
      if: inputs.restore_cache == 'true'
      run: |
        ccache --max-size=2G
        ccache --zero-stats
        ccache --show-stats --verbose
      shell: bash
    - name: Configure storm
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE="${{ inputs.buildType }}" \
              -DSTORM_PORTABLE=ON \
              -DSTORM_CARL_GIT_TAG="${{ inputs.carl_tag }}" \
              -DSTORM_DISABLE_CUDD=${{ inputs.disable_cudd == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_GLPK=${{ inputs.disable_glpk == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_GMM=${{ inputs.disable_gmm == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_GUROBI=${{ inputs.disable_gurobi == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_HIGHS=${{ inputs.disable_highs == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_LIBARCHIVE=${{ inputs.disable_libarchive == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_MATHSAT=${{ inputs.disable_mathsat == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_SOPLEX=${{ inputs.disable_soplex == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_SPOT=${{ inputs.disable_spot == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_SYLVAN=${{ inputs.disable_sylvan == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_XERCES=${{ inputs.disable_xerces == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DISABLE_Z3=${{ inputs.disable_z3 == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_DEVELOPER=${{ inputs.Developer == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_USE_CLN_EA=${{ inputs.ClnExact == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_USE_CLN_RF=${{ inputs.ClnRatfunc == 'true' && 'ON' || 'OFF' }} \
              -DSTORM_COMPILE_WITH_ALL_SANITIZERS=${{ inputs.AllSanitizers == 'true' && 'ON' || 'OFF' }} \
              ${{ inputs.cmakeArgs }} ..
      shell: bash
    - name: Build storm
      working-directory: ./build
      run: |
        make -j ${{ inputs.nr_jobs }}
      shell: bash
    - name: Print ccache stats
      if: inputs.restore_cache == 'true'
      run: ccache --show-stats --verbose
      shell: bash
    - name: Save ccache
      if: inputs.save_cache == 'true' && always() && steps.ccache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
    - name: Run storm
      working-directory: ./build
      run: ./bin/storm --version
      shell: bash
    - name: Check compile flags
      uses: ./.github/actions/check-compile-flags-action
      with:
        buildType: ${{ inputs.buildType }}
        docker: false
    - name: Run tests
      working-directory: ./build
      # Disabled sanitizer checks for now
      #run: ASAN_OPTIONS=detect_leaks=0,detect_odr_violation=0 ctest --output-on-failure
      run: ctest --output-on-failure
      shell: bash
    - name: Build starter-project
      if: inputs.install == 'true'
      uses: ./.github/actions/starter-project-action
      with:
        docker: false
        stormDir: "${GITHUB_WORKSPACE}/build"
        command: ${{ inputs.starterProjectCommand }}
    - name: Install storm
      if: inputs.install == 'true'
      working-directory: ./build
      run: make install
      shell: bash
    - name: Remove build dir
      if: inputs.install == 'true'
      run: rm -rf build
      shell: bash
    - name: Run installed storm
      if: inputs.install == 'true'
      run: /usr/local/bin/storm --version
      shell: bash
    - name: Build starter-project on installed Storm
      if: inputs.install == 'true'
      uses: ./.github/actions/starter-project-action
      with:
        docker: false
        stormDir: ""
        command: ${{ inputs.starterProjectCommand }}
