name: 'Build and test Storm (macOS)'
description: 'Configure, build, test, and install Storm inside the calling job on macOS'
inputs:
  nr_jobs:
    description: "Number of parallel build jobs"
    type: string
    default: "4"
  name:
    description: "Display name (e.g. Xcode 15.4, ARM)"
    type: string
    required: true
  xcode:
    description: "Xcode version (e.g. 15.4, latest-stable)"
    type: string
    required: true
  buildType:
    description: "CMake build type (Debug or Release)"
    type: string
    required: true
  cmakeArgs:
    description: "Extra CMake arguments"
    type: string
    default: ""
  restore_cache:
    description: "Restore ccache and Homebrew cache"
    type: boolean
    default: false
  save_cache:
    description: "Save ccache to cache"
    type: boolean
    default: false
  install:
    description: "Run post-build steps: starter project, install, run installed storm"
    type: boolean
    default: true

runs:
  using: "composite"
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode }}
    - name: Cache Homebrew downloads
      if: inputs.restore_cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/Homebrew
        key: buildtest-brew-${{ inputs.name }}-${{ hashFiles('.github/actions/build-test-mac-action/action.yml') }}
        restore-keys: |
          buildtest-brew-${{ inputs.name }}-
    - name: Ensure ccache directory exists (macOS)
      if: inputs.restore_cache == 'true'
      run: mkdir -p /Users/runner/.ccache
      shell: bash
    - name: Restore ccache (macOS)
      id: ccache-restore-macos
      if: inputs.restore_cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: /Users/runner/.ccache
        key: buildtest-ccache-macos-${{ inputs.name }}-${{ inputs.buildType }}-${{ github.run_id }}
        restore-keys: |
          buildtest-ccache-macos-${{ inputs.name }}-${{ inputs.buildType }}-
          buildtest-ccache-macos-${{ inputs.name }}-
    - name: Install dependencies
      # cmake and gmp are already installed
      run: |
        brew update
        brew install automake boost ccache cln ginac glpk highs hwloc libarchive xerces-c z3
      shell: bash
    - name: Prepare ccache
      if: inputs.restore_cache == 'true'
      run: |
        ccache --max-size=2G
        ccache --zero-stats
        ccache --show-stats --verbose
      shell: bash
    - name: Configure storm
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE="${{ inputs.buildType }}" -DSTORM_CARL_GIT_TAG="master" ${{ inputs.cmakeArgs }}
      shell: bash
    - name: Build storm
      working-directory: ./build
      run: |
        make -j ${{ inputs.nr_jobs }}
      shell: bash
    - name: Print ccache stats
      if: inputs.restore_cache == 'true'
      run: ccache --show-stats --verbose
      shell: bash
    - name: Save ccache (macOS)
      if: inputs.save_cache == 'true' && always() && steps.ccache-restore-macos.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /Users/runner/.ccache
        key: buildtest-ccache-macos-${{ inputs.name }}-${{ inputs.buildType }}-${{ github.run_id }}
    - name: Run storm (build tree)
      working-directory: ./build
      run: ./bin/storm
      shell: bash
    - name: Check compile flags
      uses: ./.github/actions/check-compile-flags-action
      with:
        buildType: ${{ inputs.buildType }}
        docker: false
    - name: Run tests
      working-directory: ./build
      run: ctest --output-on-failure
      shell: bash
    - name: Build starter-project
      if: inputs.install == 'true'
      uses: ./.github/actions/starter-project-action
      with:
        docker: false
        stormDir: "${GITHUB_WORKSPACE}/build"
        command: "${GITHUB_WORKSPACE}/resources/examples/testfiles/dtmc/brp-16-2.pm 'P=? [F s=5]'"
    - name: Install storm
      if: inputs.install == 'true'
      working-directory: ./build
      run: sudo make install
      shell: bash
    - name: Remove build dir
      if: inputs.install == 'true'
      run: |
        rm -rf ${GITHUB_WORKSPACE}/build
      shell: bash
    - name: Run installed storm
      if: inputs.install == 'true'
      run: |
        /usr/local/bin/storm --version
      shell: bash
    - name: Build starter-project on installed Storm
      if: inputs.install == 'true'
      uses: ./.github/actions/starter-project-action
      with:
        docker: false
        stormDir: ""
        command: "${GITHUB_WORKSPACE}/resources/examples/testfiles/dtmc/brp-16-2.pm 'P=? [F s=5]'"
