name: CI Prepare configurations
# Load CI configurations from .github/workflows/ci-configs.json
# Filter configurations according to given "scope"

on:
  workflow_call:
    inputs:
      mode:
        description: "Which configs to select (quick normal, extensive)"
        type: string
        required: true
    outputs:
      buildTests:
        value: ${{ jobs.prepare.outputs.buildTests }}
      compilerTests:
        value: ${{ jobs.prepare.outputs.compilerTests }}
      linuxTests:
        value: ${{ jobs.prepare.outputs.linuxTests }}
      macTests:
        value: ${{ jobs.prepare.outputs.macTests }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      buildTests: ${{ steps.filter.outputs.buildTests }}
      compilerTests: ${{ steps.filter.outputs.compilerTests }}
      linuxTests: ${{ steps.filter.outputs.linuxTests }}
      macTests: ${{ steps.filter.outputs.macTests }}
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Filter configs by scope
        id: filter
        env:
          MODE: ${{ inputs.mode }}
        run: |
          for cat in buildTests compilerTests linuxTests macTests; do
            filtered=$(jq -c --arg cat "$cat" --arg scope "$MODE" '.[$cat] | map(select(.scope | index($scope)))' .github/workflows/ci-configs.json)
            echo "$cat=$filtered" >> "$GITHUB_OUTPUT"
          done
