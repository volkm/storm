name: Build Tests

on:
  workflow_call:
    inputs:
      nr_jobs:
        description: "Number of parallel build jobs"
        type: string
        default: "4"
      name:
        description: "Display name for the test configuration"
        type: string
        required: true
      buildType:
        description: "CMake build type (Debug or Release)"
        type: string
        required: true
      Developer:
        description: "Enable developer mode"
        type: boolean
        default: false
      carl_tag:
        description: "Carl version"
        type: string
        default: "master"
      cmakeArgs:
        description: "Extra CMake arguments"
        type: string
        default: ""
      starterProjectCommand:
        description: "Command to pass to the starter-project"
        type: string
        default: "--help"
      baseImg:
        description: "Container image to run the job in (e.g. movesrwth/storm-dependencies:latest or archlinux:latest)"
        type: string
        default: "movesrwth/storm-dependencies:latest"
      setup:
        description: "Shell command to install packages before configuring"
        type: string
        default: ""
      disable_cudd:
        type: boolean
        default: false
      disable_glpk:
        type: boolean
        default: false
      disable_gmm:
        type: boolean
        default: false
      disable_gurobi:
        type: boolean
        default: false
      disable_highs:
        type: boolean
        default: false
      disable_libarchive:
        type: boolean
        default: false
      disable_mathsat:
        type: boolean
        default: false
      disable_soplex:
        type: boolean
        default: false
      disable_spot:
        type: boolean
        default: false
      disable_sylvan:
        type: boolean
        default: false
      disable_xerces:
        type: boolean
        default: false
      disable_z3:
        type: boolean
        default: false
      ClnExact:
        description: "Use CLN for exact arithmetic"
        type: boolean
        default: false
      ClnRatfunc:
        description: "Use CLN for rational functions"
        type: boolean
        default: true
      AllSanitizers:
        description: "Enable all sanitizers"
        type: boolean
        default: false
      restore_cache:
        description: "Restore ccache from cache"
        type: boolean
        default: false
      save_cache:
        description: "Save ccache to cache"
        type: boolean
        default: false
      install:
        description: "Run post-build steps: starter project, install, run installed storm"
        type: boolean
        default: true

jobs:
  buildTests:
    name: Build Tests (${{ inputs.name }}, ${{ inputs.buildType }})
    runs-on: ubuntu-latest
    container: ${{ inputs.baseImg }}
    env:
      NR_JOBS: ${{ inputs.nr_jobs }}
      CCACHE_DIR: ${{ github.workspace }}/.ci-ccache
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Install packages
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: Ensure ccache directory exists
        if: inputs.restore_cache
        run: mkdir -p "${CCACHE_DIR}"
      - name: Restore ccache
        id: ccache-restore
        if: inputs.restore_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-
            buildtest-ccache-${{ inputs.name }}-
      - name: Configure storm
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE="${{ inputs.buildType }}" \
                -DSTORM_PORTABLE=ON \
                -DSTORM_CARL_GIT_TAG="${{ inputs.carl_tag }}" \
                -DSTORM_DISABLE_CUDD=${{ inputs.disable_cudd && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_GLPK=${{ inputs.disable_glpk && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_GMM=${{ inputs.disable_gmm && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_GUROBI=${{ inputs.disable_gurobi && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_HIGHS=${{ inputs.disable_highs && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_LIBARCHIVE=${{ inputs.disable_libarchive && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_MATHSAT=${{ inputs.disable_mathsat && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_SOPLEX=${{ inputs.disable_soplex && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_SPOT=${{ inputs.disable_spot && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_SYLVAN=${{ inputs.disable_sylvan && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_XERCES=${{ inputs.disable_xerces && 'ON' || 'OFF' }} \
                -DSTORM_DISABLE_Z3=${{ inputs.disable_z3 && 'ON' || 'OFF' }} \
                -DSTORM_DEVELOPER=${{ inputs.Developer && 'ON' || 'OFF' }} \
                -DSTORM_USE_CLN_EA=${{ inputs.ClnExact && 'ON' || 'OFF' }} \
                -DSTORM_USE_CLN_RF=${{ inputs.ClnRatfunc && 'ON' || 'OFF' }} \
                -DSTORM_COMPILE_WITH_ALL_SANITIZERS=${{ inputs.AllSanitizers && 'ON' || 'OFF' }} \
                ${{ inputs.cmakeArgs }} ..
      - name: Build storm
        working-directory: ./build
        run: |
          ccache --max-size=3G
          ccache --zero-stats
          make -j ${NR_JOBS}
          ccache --show-stats --verbose
      - name: Save ccache
        if: inputs.save_cache && always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: buildtest-ccache-${{ inputs.name }}-${{ inputs.buildType }}-${{ hashFiles('CMakeLists.txt') }}-${{ github.run_id }}
      - name: Run storm
        run: ./build/bin/storm --version
      - name: Check compile flags
        uses: ./.github/actions/check-compile-flags-action
        with:
          buildType: ${{ inputs.buildType }}
          docker: false
      - name: Run tests
        # Disabled sanitizer checks for now
        #run: cd build; ASAN_OPTIONS=detect_leaks=0,detect_odr_violation=0 ctest --output-on-failure
        run: cd build && ctest --output-on-failure
      - name: Build starter-project
        if: inputs.install
        uses: ./.github/actions/starter-project-action
        with:
          docker: false
          stormDir: "${{ github.workspace }}/build"
          command: ${{ inputs.starterProjectCommand }}
      - name: Install storm
        if: inputs.install
        run: cd build && make install
      - name: Remove build dir
        if: inputs.install
        run: rm -rf build
      - name: Run installed storm
        if: inputs.install
        run: /usr/local/bin/storm --version
      - name: Build starter-project on installed Storm
        if: inputs.install
        uses: ./.github/actions/starter-project-action
        with:
          docker: false
          stormDir: ""
          command: ${{ inputs.starterProjectCommand }}
